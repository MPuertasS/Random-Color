<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Color Lab</title>
  <style>
    :root {
      --ink: #f5f7ff;
      --muted: #8c96ad;
      --panel: rgba(11, 16, 31, 0.84);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #b9c7d8;
      --accent-warm: #d7b978;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 22%, rgba(68, 119, 255, 0.16) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 13%, rgba(255, 255, 255, 0.82) 0 1px, transparent 2px),
        radial-gradient(circle at 67% 74%, rgba(157, 252, 255, 0.7) 0 1px, transparent 2px),
        radial-gradient(circle at 33% 86%, rgba(255, 255, 255, 0.64) 0 1px, transparent 2px),
        radial-gradient(ellipse at 50% -10%, #25365d 0, #10172a 48%, #060914 100%);
      background-size: 181px 173px, 257px 223px, 211px 197px, 307px 263px, 100% 100%;
      font-family: Georgia, 'Times New Roman', serif;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.12;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    main {
      position: relative;
      width: min(1080px, calc(100% - 32px));
      min-height: 100vh;
      margin: auto;
      padding: 54px 0 44px;
    }

    .masthead { text-align: center; margin-bottom: 34px; }
    .eyebrow { color: var(--accent); font: 700 11px/1.2 Consolas, monospace; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: clamp(40px, 8vw, 76px); line-height: .9; letter-spacing: -.055em; font-weight: 400; text-shadow: 0 0 24px rgba(157,252,255,.2); }
    .subtitle { margin: 0; color: var(--muted); font: 14px/1.6 Consolas, monospace; }
    .info-link { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-top: 22px; color: var(--ink); border: 1px solid var(--line); border-radius: 50%; background: rgba(255,255,255,.05); font: 700 15px Consolas, monospace; text-decoration: none; transition: border-color .2s ease, background .2s ease, transform .2s ease; }
    .info-link:hover { border-color: var(--accent); background: rgba(255,255,255,.1); transform: translateY(-2px); }

    .console {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) minmax(280px, 1.3fr);
      gap: 28px;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 55px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.06);
      backdrop-filter: blur(10px);
    }

    .controls { display: flex; flex-direction: column; justify-content: center; gap: 22px; }
    .control-group { border-top: 1px solid var(--line); padding-top: 18px; }
    .control-group:first-child { border-top: 0; padding-top: 0; }
    .label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 13px; }
    .label strong { font-size: 20px; font-weight: 400; }
    .label span { color: var(--muted); font: 11px Consolas, monospace; text-transform: uppercase; }

    .choices { display: flex; gap: 8px; flex-wrap: wrap; }
    button { color: var(--ink); font: inherit; cursor: pointer; transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease; }
    button:hover { transform: translateY(-2px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .choice {
      width: 42px; height: 38px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.045); font: 700 14px Consolas, monospace;
    }
    .choice[aria-pressed="true"] { color: #101722; background: var(--accent); border-color: var(--accent); }
    .tone { flex: 1 1 72px; height: 42px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.045); font: 12px Consolas, monospace; }
    .tone[aria-pressed="true"] { border-color: var(--tone-color); color: var(--tone-color); background: rgba(255,255,255,.07); }

    .swatches {
      display: grid;
      grid-template-columns: repeat(3, minmax(70px, 1fr));
      gap: 15px;
      min-height: 270px;
      align-content: center;
      padding: 8px;
    }
    .format-bar { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: center; }
    .format-button { min-width: 64px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.045); font: 700 11px Consolas, monospace; }
    .format-button[aria-pressed="true"] { color: #101722; background: var(--accent); border-color: var(--accent); }
    .swatch-card { min-width: 0; }
    .swatch {
      position: relative;
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,.96);
      box-shadow: 0 7px 18px rgba(0,0,0,.22), inset 0 0 12px rgba(255,255,255,.12);
      animation: float-in .45s both;
    }
    .swatch::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(255,255,255,.35); border-radius: 10px; }
    .swatch[data-empty="true"] { background: rgba(255,255,255,.025) !important; border-style: dashed; box-shadow: none; opacity: .35; }
    .code-row { display: flex; align-items: center; gap: 5px; min-width: 0; margin-top: 9px; }
    .code-value { min-width: 0; flex: 1; overflow: hidden; color: var(--ink); font: 10px Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .copy-button { flex: 0 0 27px; width: 27px; height: 27px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.06); font: 13px Consolas, monospace; }
    .copy-button.copied { color: #07111c; background: var(--accent); border-color: var(--accent); }

    @keyframes float-in { from { opacity: 0; transform: scale(.72) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @media (max-width: 700px) {
      main { padding-top: 34px; }
      .console { grid-template-columns: 1fr; padding: 20px; }
      .swatches { min-height: 230px; grid-template-columns: repeat(2, minmax(80px, 1fr)); }
      h1 { font-size: 54px; }
    }
    @media (max-width: 390px) { .swatches { gap: 9px; } .swatch { border-radius: 11px; } }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="eyebrow">Color observatory / 01</div>
      <h1>Random Color</h1>
      <p class="subtitle">Configura tu paleta y deja que el azar haga el resto.</p>
      <a class="info-link" href="info.html" aria-label="Abrir información del proyecto" title="Información">i</a>
    </header>

    <section class="console" aria-label="Generador de colores">
      <div class="controls">
        <div class="control-group">
          <div class="label"><strong>Cantidad</strong><span id="count-readout">3 colores</span></div>
          <div class="choices" role="group" aria-label="Cantidad de colores">
            <button class="choice" data-count="1" aria-pressed="false">01</button>
            <button class="choice" data-count="2" aria-pressed="false">02</button>
            <button class="choice" data-count="3" aria-pressed="true">03</button>
            <button class="choice" data-count="4" aria-pressed="false">04</button>
            <button class="choice" data-count="5" aria-pressed="false">05</button>
            <button class="choice" data-count="6" aria-pressed="false">06</button>
          </div>
        </div>

        <div class="control-group">
          <div class="label"><strong>Tono</strong><span id="tone-readout">aleatorio</span></div>
          <div class="choices" role="group" aria-label="Tono de los colores">
            <button class="tone" data-tone="blue" style="--tone-color:#65bfff" aria-pressed="false">AZUL</button>
            <button class="tone" data-tone="red" style="--tone-color:#ff7188" aria-pressed="false">ROJO</button>
            <button class="tone" data-tone="green" style="--tone-color:#82e6a6" aria-pressed="false">VERDE</button>
            <button class="tone" data-tone="yellow" style="--tone-color:#ffd66b" aria-pressed="false">AMARILLO</button>
            <button class="tone" data-tone="random" style="--tone-color:#d6c5ff" aria-pressed="true" aria-label="Color completamente aleatorio">?</button>
          </div>
        </div>

      </div>

      <div class="swatches" id="swatches" aria-live="polite" aria-label="Colores generados">
        <div class="format-bar" role="group" aria-label="Formato del código">
          <button class="format-button" data-format="hsl" aria-pressed="true">HSL</button>
          <button class="format-button" data-format="hex" aria-pressed="false">HEX</button>
          <button class="format-button" data-format="rgb" aria-pressed="false">RGB</button>
        </div>
        <div class="swatch" data-empty="true"></div>
        <div class="swatch" data-empty="true"></div>
        <div class="swatch" data-empty="true"></div>
      </div>
    </section>
  </main>

  <script>
    const state = { count: 3, tone: 'random' };
    const toneNames = { blue: 'azul', red: 'rojo', green: 'verde', yellow: 'amarillo', random: 'aleatorio' };
    const toneRanges = {
      blue: [195, 235],
      red: [345, 360],
      green: [95, 155],
      yellow: [42, 68]
    };
    let selectedFormat = 'hsl';

    const swatches = document.querySelector('#swatches');
    document.querySelectorAll('[data-format]').forEach((button) => {
      button.addEventListener('click', () => {
        selectedFormat = button.dataset.format;
        document.querySelectorAll('[data-format]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        document.querySelectorAll('.code-value').forEach((code) => {
          code.textContent = code.dataset[selectedFormat];
        });
      });
    });

    document.querySelectorAll('[data-count]').forEach((button) => {
      button.addEventListener('click', () => {
        state.count = Number(button.dataset.count);
        document.querySelectorAll('[data-count]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        document.querySelector('#count-readout').textContent = `${state.count} color${state.count === 1 ? '' : 'es'}`;
        generate();
      });
    });

    document.querySelectorAll('[data-tone]').forEach((button) => {
      button.addEventListener('click', () => {
        state.tone = button.dataset.tone;
        document.querySelectorAll('[data-tone]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        document.querySelector('#tone-readout').textContent = toneNames[state.tone];
        generate();
      });
    });

    function randomColor() {
      const [minHue, maxHue] = toneRanges[state.tone] || [0, 360];
      const hue = minHue + Math.random() * (maxHue - minHue);
      const saturation = state.tone === 'random' ? 55 + Math.random() * 35 : 68 + Math.random() * 24;
      const lightness = 42 + Math.random() * 22;
      const rgb = hslToRgb(hue, saturation, lightness);
      const hex = `#${rgb.map((value) => value.toString(16).padStart(2, '0')).join('')}`.toUpperCase();
      return {
        css: `hsl(${hue} ${saturation}% ${lightness}%)`,
        hsl: `hsl(${hue.toFixed(2)} ${saturation.toFixed(2)}% ${lightness.toFixed(2)}%)`,
        hex,
        rgb: `rgb(${rgb.join(', ')})`
      };
    }

    function hslToRgb(hue, saturation, lightness) {
      const s = saturation / 100;
      const l = lightness / 100;
      const chroma = (1 - Math.abs(2 * l - 1)) * s;
      const x = chroma * (1 - Math.abs((hue / 60) % 2 - 1));
      const match = l - chroma / 2;
      let rgb = [0, 0, 0];
      if (hue < 60) rgb = [chroma, x, 0];
      else if (hue < 120) rgb = [x, chroma, 0];
      else if (hue < 180) rgb = [0, chroma, x];
      else if (hue < 240) rgb = [0, x, chroma];
      else if (hue < 300) rgb = [x, 0, chroma];
      else rgb = [chroma, 0, x];
      return rgb.map((value) => Math.round((value + match) * 255));
    }

    function generate() {
      swatches.innerHTML = '';
      const formatBar = document.createElement('div');
      formatBar.className = 'format-bar';
      formatBar.setAttribute('role', 'group');
      formatBar.setAttribute('aria-label', 'Formato del código');
      formatBar.innerHTML = '<button class="format-button" data-format="hsl" aria-pressed="false">HSL</button><button class="format-button" data-format="hex" aria-pressed="false">HEX</button><button class="format-button" data-format="rgb" aria-pressed="false">RGB</button>';
      swatches.appendChild(formatBar);
      formatBar.querySelectorAll('[data-format]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.format === selectedFormat));
        button.addEventListener('click', () => {
          selectedFormat = button.dataset.format;
          formatBar.querySelectorAll('[data-format]').forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
          swatches.querySelectorAll('.code-value').forEach((code) => {
            code.textContent = code.dataset[selectedFormat];
            code.nextElementSibling.setAttribute('aria-label', `Copiar ${code.textContent}`);
          });
        });
      });
      for (let index = 0; index < state.count; index += 1) {
        const color = randomColor();
        const card = document.createElement('div');
        card.className = 'swatch-card';
        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = color.css;
        swatch.style.animationDelay = `${index * 70}ms`;
        const code = document.createElement('span');
        code.className = 'code-value';
        code.dataset.hsl = color.hsl;
        code.dataset.hex = color.hex;
        code.dataset.rgb = color.rgb;
        code.textContent = color[selectedFormat];
        const copy = document.createElement('button');
        copy.className = 'copy-button';
        copy.type = 'button';
        copy.title = 'Copiar código';
        copy.setAttribute('aria-label', `Copiar ${color[selectedFormat]}`);
        copy.textContent = '⧉';
        copy.addEventListener('click', async () => {
          await navigator.clipboard.writeText(code.textContent);
          copy.textContent = '✓';
          copy.classList.add('copied');
          setTimeout(() => { copy.textContent = '⧉'; copy.classList.remove('copied'); }, 1100);
        });
        const codeRow = document.createElement('div');
        codeRow.className = 'code-row';
        codeRow.append(code, copy);
        card.append(swatch, codeRow);
        swatches.appendChild(card);
      }
    }
  </script>
</body>
</html>
